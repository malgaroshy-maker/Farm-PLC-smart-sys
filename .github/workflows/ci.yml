name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: API + simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: pip install -r apps/api/requirements.txt
      - name: Lint API
        working-directory: apps/api
        run: ruff check . && ruff format --check app tests
      - name: Test API
        working-directory: apps/api
        run: pytest -q
      - name: Migrations apply cleanly
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: alembic upgrade head && alembic check
      - name: Lint simulator
        working-directory: apps/simulator
        run: ruff check . && ruff format --check .
      - name: Test simulator
        working-directory: apps/simulator
        run: pytest -q

  web:
    name: Web + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
