<style>
:root{
  /* Layout: one column (max 1120px); a sticky cost bar under the header; builder rows stack on phones */
  --bg:#f4f5f0;--surface:#ffffff;--ink:#16211b;--muted:#5a6a60;--line:#dde2d8;--soft:#e8eee5;

  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1512;--surface:#16201a;--ink:#e5ebe5;--muted:#9aa89f;--line:#28342d;--soft:#1c2923;--accent:#5fc3a6;--accent-ink:#0c1410;--sand:#d4b277;--cable:#e08a5f;--est:#d4b277;--essential:#5fc3a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--surface:#16201a;--ink:#e5ebe5;--muted:#9aa89f;--line:#28342d;--soft:#1c2923;--accent:#5fc3a6;--accent-ink:#0c1410;--sand:#d4b277;--cable:#e08a5f;--est:#d4b277;--essential:#5fc3a6;color-scheme:dark}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:700}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
header{display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);line-height:1.25;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:21px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;margin:8px 0 0}
p{margin:0;max-width:72ch}
.lede{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;min-height:38px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.controls>div{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-block:1px solid var(--line);padding-block:10px}
.bar-in{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline}
.big{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.kv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv b{color:var(--ink);font-weight:600}
.phases{display:flex;gap:4px 14px;flex-wrap:wrap}
ul.points{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;max-width:80ch}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;max-width:none}
.note.approve{border-inline-start:4px solid var(--accent)}
.note.warn{border-inline-start:4px solid var(--cable)}
.note.warn ul{margin:4px 0 0;padding-inline-start:18px}
ul.caps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
ul.caps li{display:flex;gap:8px;align-items:baseline;font-size:14px}
ul.caps li.no{color:var(--muted)}
ul.caps .mark{font-weight:700;width:1em;flex-shrink:0;text-align:center}
ul.caps li.yes .mark{color:var(--accent)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:780px){.mapgrid{grid-template-columns:1fr}}
.map{width:100%;height:auto;background:var(--soft);border-radius:12px;border:1px solid var(--line)}
.m-boundary{fill:none;stroke:var(--sand);stroke-width:3;stroke-dasharray:8 6}
.m-zone{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:1.4}
.m-zone.sel{fill:color-mix(in srgb,var(--accent) 30%,transparent)}
.m-cable{fill:none;stroke:var(--cable);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85;pointer-events:none}
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible circle,.hot:focus-visible rect,.hot:focus-visible polygon{stroke:var(--ink);stroke-width:4}
.m-valve circle{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.m-valve.sel circle{fill:var(--cable)}
.m-valve text{fill:var(--accent-ink);font:700 13px var(--f-mono);text-anchor:middle;pointer-events:none}
.m-sensor polygon{fill:var(--sand);stroke:var(--surface);stroke-width:2}
.m-sensor.sel polygon{fill:var(--cable)}
.m-sensor text{fill:var(--ink);font:600 15px "IBM Plex Sans Arabic",sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--soft);stroke-width:4;pointer-events:none}
.m-eq rect{fill:var(--ink)}
.m-eq.sel rect{fill:var(--cable)}
.m-eq text{fill:var(--bg);font:700 14px var(--f-mono);text-anchor:middle;pointer-events:none}
.m-lead{stroke:var(--ink);stroke-width:1.5}
.m-north,.m-scale text{fill:var(--muted);font:600 16px var(--f-mono)}
.m-scale line{stroke:var(--muted);stroke-width:3}
html[lang="ar"] .en-only, html[lang="en"] .ar-only{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
.sw.tri{border-radius:0;background:none;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid var(--sand)}
.sw.sq{border-radius:3px;background:var(--ink)}
.sw.line{border-radius:0;height:0;width:22px;border-top:4px solid var(--cable)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{margin:0}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.panel dt{color:var(--muted)}
.panel dd{margin:0}
.panel ul{margin:4px 0 0;padding-inline-start:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.group{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.25fr) auto;gap:8px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row.off{opacity:.55}
.row.off .cost{text-decoration:line-through}
@media (max-width:780px){.row{grid-template-columns:auto minmax(0,1fr)}.row .opt,.row .cost{grid-column:2}.row .cost{text-align:start}}
.row input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.what{display:flex;flex-direction:column;gap:4px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.chip.ess{border-color:var(--essential);color:var(--essential);font-weight:600}
.skip{font-size:13px;color:var(--muted)}
.opt{display:flex;flex-direction:column;gap:4px;min-width:0}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%;min-height:38px}
.optnote{font-size:12.5px;color:var(--muted)}
.cost{font-family:var(--f-mono);font-size:14px;text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.cost small{display:block;color:var(--muted);font-size:11.5px}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.est{font-family:var(--f-mono);font-size:11.5px;color:var(--est)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:12px;color:var(--muted);background:var(--soft);font-weight:600}
td.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--soft)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.row,.m-zone{transition:opacity .15s,fill .15s}}

": "ما تحصل عليه بهذه القائمة"}, "checks": {"en": "Check these choices", "ar": "راجع هذه الاختيارات"}, "items_on": {"en": "Items", "ar": "عدد البنود"}, "local_note": {"en": "Local labour: no freight or installation added.", "ar": "عمالة محلية: بلا شحن أو تركيب إضافي."}, "override": {"en": "When something goes down", "ar": "عند تعطل أي جزء"}, "install_mode": {"en": "Installation", "ar": "التركيب"}, "install_contractor": {"en": "Contractor (15%)", "ar": "مقاول (15%)"}, "install_own": {"en": "Own workers (5%)", "ar": "عمالك (5%)"}, "connection": {"en": "Wireless option", "ar": "خيار لاسلكي"}, "conn_cable": {"en": "Cable (near)", "ar": "كابل (قريبة)"}, "conn_box": {"en": "Cable or radio box", "ar": "كابل أو صندوق لاسلكي"}, "footer": {"en": "Generated from the farm's own map and zone data. Prices change often; treat every figure as a planning number.", "ar": "مولّد من خريطة المزرعة وبيانات مناطقها. الأسعار تتغير كثيراً؛ اعتبر كل رقم تقديراً للتخطيط."}}, "summary": [{"en": "Controller: <b>ET 200SP CPU 1512SP-1 PN<\/b> (S7-1500 family). OPC UA works in your TIA Portal V19 and PLCSIM Advanced simulates it, so the G5 tests carry over. For the bare minimum, the cheaper <b>S7-1200 1214C<\/b> also works with V19.", "ar": "وحدة التحكم: <b>ET 200SP CPU 1512SP-1 PN<\/b> من عائلة S7-1500. يعمل OPC UA في TIA Portal V19 لديك ويحاكيها PLCSIM Advanced، فتنتقل اختبارات G5 كما هي. وللحد الأدنى يعمل أيضاً <b>S7-1200 1214C<\/b> الأرخص مع V19."}, {"en": "Valves: <b>buried 24 VAC cable in the existing pipe trenches<\/b> (about 800 m on three runs). Every valve stays under the PLC's interlocks and nothing in the field needs batteries.", "ar": "الصمامات: <b>كابل 24 فولت مدفون في خنادق الأنابيب الحالية<\/b> (نحو 800 م على ثلاثة مسارات). يبقى كل صمام تحت حمايات الـPLC ولا شيء في الحقل يحتاج بطاريات."}, {"en": "Soil sensors: <b>wireless (LoRaWAN)<\/b>, 21 sensors at 12 stations and one gateway at the control room. No extra trenching.", "ar": "حساسات التربة: <b>لاسلكية (LoRaWAN)<\/b>، 21 حساساً في 12 محطة وبوابة واحدة في غرفة التحكم، بلا حفر إضافي."}, {"en": "Head unit: a <b>speed drive on the booster<\/b>, an <b>electromagnetic flow meter<\/b>, a <b>pressure transmitter<\/b>, and a <b>level probe in the well<\/b> for steady pressure, water per zone, leak alarms and dry-run protection.", "ar": "وحدة الرأس: <b>منظّم سرعة لمضخة التعزيز<\/b>، <b>عداد تدفق كهرومغناطيسي<\/b>، <b>حساس ضغط<\/b>، و<b>حساس مستوى في البئر<\/b>، لضغط ثابت ومياه كل منطقة وإنذارات التسريب وحماية المضخة من التشغيل على الجاف."}, {"en": "Internet: Starlink is not available in Libya (talks on hold), so remote access uses a <b>4G router with an outdoor antenna<\/b>. Test Libyana and Almadar signal at the control room first.", "ar": "الإنترنت: Starlink غير متاح في ليبيا (المفاوضات متوقفة)، لذا يتم الوصول عن بُعد عبر <b>راوتر 4G مع هوائي خارجي<\/b>. اختبر إشارة ليبيانا والمدار في غرفة التحكم أولاً."}], "plc": [{"en": ["S7-1200 classic (CPU 1214C)", "Yes", "No", "≈ $650 + $100 license", "Cheapest Siemens choice with OPC UA in V19; phased out from 1 Nov 2026."], "ar": ["S7-1200 الحالي (CPU 1214C)", "نعم", "لا", "≈ 650$ + 100$ ترخيص", "أرخص خيار من Siemens مع OPC UA في V19؛ يتوقف إنتاجه من 1 نوفمبر 2026."]}, {"en": ["S7-1200 G2", "Only from TIA V21", "No", "≈ $600–$860", "New generation; budget a TIA Portal upgrade."], "ar": ["S7-1200 G2", "فقط من TIA V21", "لا", "≈ 600–860$", "الجيل الجديد؛ احسب تكلفة ترقية TIA Portal."]}, {"en": ["ET 200SP CPU 1512SP-1 PN", "Yes", "Yes", "≈ $1,100 + $250 license", "Recommended: matches G5 and your PLCSIM Advanced."], "ar": ["ET 200SP CPU 1512SP-1 PN", "نعم", "نعم", "≈ 1,100$ + 250$ ترخيص", "الموصى به: يطابق G5 وPLCSIM Advanced لديك."]}, {"en": ["S7-1500 CPU 1511-1 PN", "Yes", "Yes", "≈ $1,000–$1,600 + $250 license", "Most expandable; built-in display."], "ar": ["S7-1500 CPU 1511-1 PN", "نعم", "نعم", "≈ 1,000–1,600$ + 250$ ترخيص", "الأكثر قابلية للتوسعة، مع شاشة مدمجة."]}, {"en": ["LOGO! 8.4 / Delta AS", "No OPC UA (Modbus TCP)", "No", "≈ $450", "Cheap, but needs a Modbus adapter in the app."], "ar": ["LOGO! 8.4 / Delta AS", "لا OPC UA (Modbus TCP)", "لا", "≈ 450$", "رخيص، لكن يحتاج محوّل Modbus في التطبيق."]}, {"en": ["Unitronics UniStream", "OPC UA built in", "No", "≈ $900", "Includes a touch screen; programmed outside TIA."], "ar": ["Unitronics UniStream", "OPC UA مدمج", "لا", "≈ 900$", "يتضمن شاشة لمس؛ يُبرمج خارج TIA."]}], "plcHead": {"en": ["Controller", "OPC UA with your TIA V19", "PLCSIM Advanced", "Price", "Note"], "ar": ["وحدة التحكم", "OPC UA مع TIA V19 لديك", "PLCSIM Advanced", "السعر", "ملاحظة"]}, "wiring": [{"en": ["Buried cable (recommended)", "≈ $2,000–$3,600", "Cheapest parts; no batteries; the PLC switches every valve, so interlocks always apply.", "Trench work; long cables need surge protection.", "Best for 12 valves within 300 m."], "ar": ["كابل مدفون (الموصى به)", "≈ 2,000–3,600$", "أرخص القطع؛ بلا بطاريات؛ الـPLC يشغّل كل صمام فتنطبق الحمايات دائماً.", "أعمال حفر؛ الكوابل الطويلة تحتاج حماية من الصواعق.", "الأفضل لـ12 صماماً ضمن 300 م."]}, {"en": ["RS-485 remote I/O box", "≈ $600–$1,200 per box", "Fewer long cables; easy to add southern zones later.", "A powered box in the field to maintain.", "Good if zones are added in the south."], "ar": ["صندوق مداخل/مخارج بعيد RS-485", "≈ 600–1,200$ للصندوق", "كوابل طويلة أقل؛ سهولة إضافة مناطق جنوبية لاحقاً.", "صندوق مغذّى بالكهرباء في الحقل يحتاج صيانة.", "مناسب إن أُضيفت مناطق في الجنوب."]}, {"en": ["Wireless valve controllers", "≈ $150–$385 per valve", "No trenching; quick to install.", "Batteries; valves outside the PLC's direct control; radio delays.", "Use wireless for sensors, not valves."], "ar": ["متحكمات صمامات لاسلكية", "≈ 150–385$ لكل صمام", "بلا حفر؛ تركيب سريع.", "بطاريات؛ الصمامات خارج تحكم الـPLC المباشر؛ تأخير لاسلكي.", "اللاسلكي للحساسات وليس للصمامات."]}, {"en": ["Two-wire decoders", "≈ $150–$250 per decoder", "One cable for all valves.", "Needs the maker's controller; doesn't fit a PLC.", "Not recommended here."], "ar": ["نظام السلكين مع مفككات", "≈ 150–250$ للمفكك", "كابل واحد لكل الصمامات.", "يحتاج متحكم الشركة المصنعة؛ لا يناسب الـPLC.", "غير موصى به هنا."]}], "wiringHead": {"en": ["Option", "Cost", "For", "Against", "Verdict"], "ar": ["الخيار", "التكلفة", "المزايا", "العيوب", "الحكم"]}, "buying": [{"en": "<b>Local (Tripoli, Misrata):<\/b> easiest warranty and support for Siemens parts and irrigation valves. Ask for quotes on the exact part numbers.", "ar": "<b>محلياً (طرابلس، مصراتة):<\/b> أسهل في الضمان والدعم لقطع Siemens وصمامات الري. اطلب عروضاً على أرقام القطع نفسها."}, {"en": "<b>Import (Turkey, Tunisia, EU):<\/b> usually better prices for Siemens, Danfoss, Netafim and Bermad. Libya applies a 4% port services tax on the CIF value of most goods; sources disagree on further duties (0–25% by HS code), so confirm with a customs broker.", "ar": "<b>استيراد (تركيا، تونس، أوروبا):<\/b> أسعار أفضل عادةً لـSiemens وDanfoss وNetafim وBermad. تفرض ليبيا رسم خدمات موانئ 4% على قيمة CIF لمعظم البضائع، والمصادر تختلف حول رسوم إضافية (0–25% حسب رمز HS)، فتأكد مع مخلّص جمركي."}, {"en": "<b>China direct:<\/b> good value for flow meters, generic transmitters and LoRaWAN sensors. Buy one sample first and check its documentation: Modbus register map, IP rating, cable length.", "ar": "<b>من الصين مباشرة:<\/b> قيمة جيدة لعدادات التدفق والحساسات العامة وحساسات LoRaWAN. اشترِ عينة واحدة أولاً وتحقق من وثائقها: خريطة سجلات Modbus، درجة الحماية IP، طول الكابل."}], "survey": [{"en": "Pump nameplates: well pump and booster kW/HP, voltage, current; well depth and pump depth.", "ar": "لوحات بيانات المضخات: قدرة مضخة البئر ومضخة التعزيز، الجهد، التيار؛ عمق البئر وعمق المضخة."}, {"en": "Valve and pipe sizes at each zone's take-off.", "ar": "مقاسات الصمامات والأنابيب عند تفرّع كل منطقة."}, {"en": "Real pipe routes (the map's routes are a best guess, and cable lengths follow them).", "ar": "مسارات الأنابيب الفعلية (مسارات الخريطة تقديرية وأطوال الكوابل تتبعها)."}, {"en": "4G signal at the control room for Libyana and Almadar (a .com/forum/ph/en/post/1274978"], "et200sp": ["RS Components: ET 200SP CPU 1512SP-1 PN (£927 ex VAT)", "https://uk.rs-online.com/web/p/plcs-programmable-logic-controllers/2032838"], "s71511": ["Steiner Electric: S7-1500 CPU 1511-1 PN ($1,590)", "https://www.steinerelectric.com/Product/Siemens-6ES75111AL030AB0-Siemens-S7-1500CPU-1511-1PNMemory-300KB-Prog-1-5MB-Data-1355197"], "plc_budget": ["Budget PLC comparison (Delta, Unitronics, S7-1200)", "https://industrialmonitordirect.com/blogs/knowledgebase/budget-plcs-with-remote-io-s7-1200-vs-alternatives"], "unistream": ["Unitronics UniStream: OPC UA and Modbus TCP built in", "https://unitronicsplc.com/programmable-controllers-unistream-series/"], "ktp700": ["RS Components: KTP700 Basic (£850 ex VAT)", "https://uk.rs-online.com/web/p/hmi-displays/8643961"], "rut241": ["Bechtle: Teltonika RUT241 (€140–€183)", "https://www.bechtle.com/fr-en/shop/teltonika-rut241-industrial-4g-router--4831521--p"], "starlink": ["Space in Africa: Starlink's Libya entry on hold (Sep 2026)", "https://spaceinafrica.com/2026/09/13/starlinks-libya-market-entry-remains-on-hold-as-negotiations-continue/"], "netafim80": ["HydroBuilder: Netafim Series 80 2\" 24VAC ($156–$196)", "https://hydrobuilder.com/products/netafim-series-80-angle-control-valve-2-inch-24vac-61et2gh2-an"], "bermad200": ["NCPW: Bermad 2\" 24VAC 200 series ($335)", "https://ncpw.com/product/bermad-2-24vac-solenoid-controlled-valve-200-series-ir-210-3w-x/"], "magmeter_cn": ["Alibaba: DN50 electromagnetic flowmeter 4-20 mA/pulse (~$458)", "https://www.alibaba.com/product-detail/DN50-irrigation-water-flowmeter-industrial-waste_1600086575352.html"], "mbs3000": ["TME: Danfoss MBS 3000 0-10 bar 4-20 mA (~$205–$221)", "https://www.tme.eu/gb/details/060G1455/"], "level": ["Selection guide: hydrostatic (~$300–$500) vs ultrasonic level", "https://industrialmonitordirect.com/blogs/knowledgebase/water-tank-level-sensors-hydrostatic-vs-ultrasonic-vs-radar-selection"], "g120x": ["Bürklin: SINAMICS G120X 7.5 kW (€1,151)", "https://www.buerklin.com/en/p/siemens/variable-speed-drive-and-accessories/6sl3220-3ye24-0up0/80P1912/"], "invt_pv": ["INVT GD100-PV solar pump inverter (7.5 kW models)", "https://www.invt.com/products/gd100-pv-series-solar-pump-28"], "submonitor": ["Franklin SubMonitor Connect listings ($1,494–$2,831)", "https://rcworst.com/franklin-electric-5860005110-submonitor-connect-premium-1-135a.html"], "sdm630": ["Taphome: Eastron SDM630 V3 Modbus meter (€146)", "https://hardware.taphome.com/en/electric-meter/"], "dosatron": ["Dosatron D25RE2 price range ($700–$900)", "https://toledoindoorgarden.com/dosing-sliders"], "soil_rs485": ["DFRobot RS485 soil moisture/temp/EC sensor ($69–$73)", "https://www.dfrobot.com/product-2830.html"], "s2105": ["RobotShop: SenseCAP S2105 LoRaWAN soil sensor ($139)", "https://robotshop.com/products/seeedstudio-sensecap-s2105-lorawan-soil-moisture-temperature-ec-sensor"], "ug65": ["AgTech NSW: Milesight UG65 LoRaWAN gateway (~$470)", "https://www.agtech.dpi.nsw.gov.au/collections/connectivity-solutions/products/milesight-lorawan-ug65-semi-industrial-gateway"], "uc511": ["MCCI / iot-shop.de: Milesight UC511 LoRaWAN valve controller ($145–$385)", "https://store.mcci.com/products/solenoid-valve-controller-uc51x"], "sentek": ["Trellis: Watermark vs Sentek profile probes", "https://www.mytrellis.com/blog/watermark-sentek"], "hik_solar": ["Security Wholesalers: Hikvision 4K ColorVu solar 4G kit (AU$3,340)", "https://www.securitywholesalers.com.au/product/hikvision-ds-2xs6a87g1-l-c32s80-4k-colorvu-fixed-bullet-solar-power-4g-network-camera-no-battery/"], "libya_customs": ["Bank of Scotland trade guide: Libya customs (4% port tax)", "https://www.bankofscotlandtrade.co.uk/en/market-potential/libya/customs"], "libya_procure": ["Libya industrial procurement landscape 2026 (duties 0–25% by HS code)", "https://papaverai.com/blog/libya-industrial-economic-development/"], "opcua_lic": ["SIMATIC OPC UA S7-1200 Basic runtime license, 6ES7823-0BA00-2BA0 (€79–€94)", "https://industry-electronics.com/siemens/6es78230ba002ba0-6es7823-0ba00-2ba0-simatic-opc-ua-s7-1200-basic-lieske_1909651.htm"], "opcua_lic15": ["SIMATIC OPC UA S7-1500 runtime license datasheet (6ES7823-0BE00-2BA0)", "https://media.distributordatasolutions.com/siemenscomplete/2023q2/documents/e39d93817073cde12a49b42bd04c0248f9fe1d02.pdf"], "minipc": ["Shuttle NE10N fanless Intel N100 mini PC (€160–€194)", "https://aio.lv/en/product--shuttle-ne10n--11445919.md"], "used1200": ["eBay: used/refurbished S7-1200 CPU 1214C (€256–€520; 90-day used trend ≈ $150)", "https://www.ebay.de/itm/285738109230"], "smart200": ["eBay: S7-200 SMART CPU SR20 ($99–$179)", "https://www.ebay.com/itm/315851701171"], "b311": ["aio.lv: Huawei B311 4G router (€63–€74)", "https://aio.lv/en/product--huawei-51060dye--6024731.md"], "rpi5": ["Raspberry Pi 5 8 GB kits now €240–€255 (memory price rises)", "https://raspberry.tips/en/?p=11327"], "ebyte": ["Ebyte E95-DTU RS-485 LoRa radio ($13–$25)", "https://ebyteiot.com/products/ebyte-rs485-lora-radio-station-rf-modbus-3000m-long-distance-wireless-transceiver-20dbm-433m-lora"], "motor_valve": ["Ussolid 2\" UPVC motorized ball valve 24 V ($145–$180)", "https://ussolid.com/sv/products/2-double-union-upvc-motorized-ball-valve-dc-24v-6-wire-with-signal-feedback-3w2c-normally-closed-with-manual-override-epdm-seal"], "hunter_2wire": ["Hunter two-wire / decoder comparison", "https://hunterirrigation.com/node/486591"]}, "caps": [{"need": [["cpu"], ["io"], ["server"], ["trafo"], ["v2", "v15", "v1"], ["vcable", "wireless_valves"], ["starters", "vfd"]], "en": "Automatic irrigation of the 12 zones from the app", "ar": "ري تلقائي للمناطق الـ12 من التطبيق"}, {"need": [["estop"]], "en": "Emergency stop at the panel", "ar": "إيقاف طوارئ على اللوحة"}, {"need": [["override"]], "en": "Manual override if the PLC, app or internet is down", "ar": "تشغيل يدوي إذا توقف الـPLC أو التطبيق أو الإنترنت"}, {"need": [["tanklevel"], ["flow"], ["pressure"]], "en": "Safety interlocks: low tank, no flow, pressure out of range", "ar": "حمايات السلامة: خزان منخفض، لا تدفق، ضغط خارج النطاق"}, {"need": [["flow"]], "en": "Water used per zone and leak alarms", "ar": "مياه كل منطقة وإنذارات التسريب"}, {"need": [["pumpprot", "welllevel"]], "en": "Well pump protected from running dry", "ar": "حماية مضخة البئر من التشغيل على الجاف"}, {"need": [["router"]], "en": "Use the app away from the farm", "ar": "استخدام التطبيق من خارج المزرعة"}, {"need": [["soil"]], "en": "Irrigation based on measured soil water", "ar": "ري حسب رطوبة التربة المقاسة"}, {"need": [["vfd"]], "en": "Steady pressure and lower pump energy", "ar": "ضغط ثابت وطاقة أقل للمضخة"}, {"need": [["meter"]], "en": "Energy use per pump (early warning of a failing pump)", "ar": "استهلاك كهرباء كل مضخة (إنذار مبكر بتعطلها)"}, {"need": [["ups"]], "en": "Keeps running through short power cuts", "ar": "يستمر العمل خلال انقطاعات الكهرباء القصيرة"}, {"need": [["dp"]], "en": "Filter clogging alarm", "ar": "إنذار انسداد الفلتر"}, {"need": [["fert"]], "en": "Fertilizer through the drip lines", "ar": "التسميد مع الري"}, {"need": [["cams", "cam4g"]], "en": "Video of the farm on the phone", "ar": "فيديو المزرعة على الهاتف"}, {"need": [["solar"]], "en": "Solar power for the well pump", "ar": "طاقة شمسية لمضخة البئر"}], "checks": [{"when": [["soil", "rec", "prem"], ["gateway", "off"]], "en": "Wireless soil sensors need the LoRaWAN gateway.", "ar": "حساسات التربة اللاسلكية تحتاج بوابة LoRaWAN."}, {"when": [["soil", "basic"], ["rs485", "off"]], "en": "Wired soil sensors need the RS-485 port.", "ar": "حساسات التربة السلكية تحتاج منفذ RS-485."}, {"when": [["meter", "on"], ["rs485", "off"]], "en": "Energy meters need the RS-485 port.", "ar": "عدادات الكهرباء تحتاج منفذ RS-485."}, {"when": [["cpu", "et200sp", "s71511"], ["mc", "off"]], "en": "S7-1500 family controllers need the memory card.", "ar": "وحدات عائلة S7-1500 تحتاج بطاقة الذاكرة."}, {"when": [["cpu", "s71200", "g2", "used1200"], ["io", "rec", "prem"]], "en": "The I/O modules don't match the controller: pick the S7-1200 modules.", "ar": "وحدات المداخل والمخارج لا تناسب وحدة التحكم: اختر وحدات S7-1200."}, {"when": [["cpu", "et200sp", "s71511"], ["io", "min", "basic"]], "en": "The I/O modules don't match the controller: pick the ET 200SP or S7-1500 modules.", "ar": "وحدات المداخل والمخارج لا تناسب وحدة التحكم: اختر وحدات ET 200SP أو S7-1500."}, {"when": [["cpu", "s71200", "g2", "used1200"], ["opcua", "s71500"]], "en": "The OPC UA license must be the S7-1200 one.", "ar": "ترخيص OPC UA يجب أن يكون الخاص بـS7-1200."}, {"when": [["cpu", "et200sp", "s71511"], ["opcua", "s71200"]], "en": "The OPC UA license must be the S7-1500 one.", "ar": "ترخيص OPC UA يجب أن يكون الخاص بـS7-1500."}, {"when": [["cpu", "smart200"]], "en": "The S7-200 SMART needs a Modbus TCP adapter in the app first, needs no OPC UA license, and its I/O is in the CPU option.", "ar": "يحتاج S7-200 SMART أولاً محوّل Modbus TCP في التطبيق، ولا يحتاج ترخيص OPC UA، ومداخله ومخارجه ضمن خيار الوحدة."}, {"when": [["cpu", "used1200", "s71200", "g2"], ["opcua", "off"]], "en": "The S7-1200 needs the OPC UA license for the app to connect.", "ar": "يحتاج S7-1200 ترخيص OPC UA ليتصل التطبيق."}, {"when": [["wireless_valves", "boxes"], ["rs485", "off"]], "en": "The radio boxes need the RS-485 port on the PLC.", "ar": "الصناديق اللاسلكية تحتاج منفذ RS-485 على الـPLC."}, {"when": [["wireless_valves", "uc511"], ["gateway", "off"]], "en": "LoRaWAN valve controllers need the LoRaWAN gateway.", "ar": "متحكمات الصمامات LoRaWAN تحتاج بوابة LoRaWAN."}, {"when": [["vcable", "near"], ["wireless_valves", "off"]], "en": "With cable to the near zones only, the 6 far zones need the wireless boxes.", "ar": "مع كابل للمناطق القريبة فقط، تحتاج المناطق الست البعيدة الصناديق اللاسلكية."}, {"when": [["vcable", "min", "rec", "prem", "mixed"], ["wireless_valves", "boxes"]], "en": "The cable already reaches every zone; pick 'near zones only' cable or drop the radio boxes.", "ar": "الكابل يصل لكل المناطق أصلاً؛ اختر كابل المناطق القريبة فقط أو احذف الصناديق اللاسلكية."}, {"when": [["cpu", "logo", "delta"]], "en": "LOGO! and Delta need a Modbus TCP adapter in the app before they can be used, and they need no OPC UA license.", "ar": "LOGO! وDelta يحتاجان محوّل Modbus TCP في التطبيق قبل استخدامهما، ولا يحتاجان ترخيص OPC UA."}, {"when": [["cpu", "g2"]], "en": "The S7-1200 G2 OPC UA server needs TIA Portal V21; you have V19.", "ar": "خادم OPC UA في S7-1200 G2 يحتاج TIA Portal V21، ولديك V19."}, {"when": [["vcable", "min", "rec", "prem", "mixed"], ["wireless_valves", "uc511"]], "en": "You picked both cable and wireless valve controllers; one is enough.", "ar": "اخترت الكابل والمتحكمات اللاسلكية معاً؛ يكفي أحدهما."}, {"when": [["vcable", "off"], ["wireless_valves", "off"]], "en": "The valves have no connection: pick the cable or the wireless controllers.", "ar": "الصمامات بلا توصيل: اختر الكابل أو المتحكمات اللاسلكية."}, {"when": [["starters", "off"], ["vfd", "off"]], "en": "The PLC can't start the pumps without starters or a drive.", "ar": "لا يستطيع الـPLC تشغيل المضخات دون مشغّلات أو منظّم سرعة."}, {"when": [["solar", "on"], ["vfd", "both"]], "en": "With solar, the solar inverter already drives the well pump; one G120X (booster) is enough.", "ar": "مع الطاقة الشمسية يشغّل العاكس الشمسي مضخة البئر؛ يكفي G120X واحد لمضخة التعزيز."}, {"when": [["solar", "off"], ["starters", "off"], ["vfd", "rec", "prem"]], "en": "Without solar, the well pump needs a starter (or a second drive).", "ar": "بدون الطاقة الشمسية تحتاج مضخة البئر مشغّلاً (أو منظّم سرعة ثانياً)."}, {"when": [["vfd", "rec", "prem"], ["starters", "two"]], "en": "The booster runs on its drive, so one starter (well pump) is enough.", "ar": "مضخة التعزيز تعمل بمنظّم السرعة، فيكفي مشغّل واحد لمضخة البئر."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const S = {lang:'ar', cur:'USD', preset:'recommended', install:'contractor', sel:{}, focus:null};
try { const v = JSON.parse(localStorage.getItem('farmHw') || '{}'); if (v.lang) S.lang = v.lang; if (v.cur) S.cur = v.cur; } catch (e) {}
const save = () => { try { localStorage.setItem('farmHw', JSON.stringify({lang:S.lang, cur:S.cur})); } catch (e) {} };
const t = k => (DATA.T[k] || {})[S.lang] || k;
const L = o => (o && typeof o === 'object' && 'en' in o) ? o[S.lang] : o;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('en-US', {maximumFractionDigits: 0});
const lydLabel = () => S.lang === 'ar' ? ' د.ل' : ' LYD';
const money = usd => S.cur === 'USD' ? '$' + nf.format(usd) : nf.format(usd * DATA.rate) + lydLabel();
const other = usd => S.cur === 'USD' ? nf.format(usd * DATA.rate) + lydLabel() : '$' + nf.format(usd);

function defaultOpt(it) {
  for (const p of ['recommended','basic','premium','minimum']) { const o = it.options.find(o => o.presets.includes(p)); if (o) return o.key; }
  return it.options[0].key;
}
function applyPreset(p) {
  S.preset = p;
  S.install = DATA.presetInstall[p] || 'contractor';
  for (const it of DATA.items) {
    const o = it.options.find(o => o.presets.includes(p));
    S.sel[it.id] = o ? {on:true, opt:o.key} : {on:false, opt:defaultOpt(it)};
  }
}
const optOf = it => it.options.find(o => o.key === S.sel[it.id].opt) || it.options[0];
const costOf = it => S.sel[it.id].on ? optOf(it).qty * optOf(it).unit : 0;

function totals() {
  const k = Object.assign({}, DATA.k, {install: S.install === 'own' ? DATA.k.installOwn : DATA.k.install});
  let hw = 0, imp = 0, n = 0; const ph = {1:0, 2:0, 3:0};
  for (const it of DATA.items) {
    const c = costOf(it); if (!c) continue;
    n++; hw += c; if (!it.local) imp += c;
    ph[it.phase] += (it.local ? c : c * (1 + k.freight + k.install)) * (1 + k.contingency);
  }
  const f = imp * k.freight, i = imp * k.install, c = (hw + f + i) * k.contingency;
  return {hw, f, i, c, n, total: hw + f + i + c, ph};
}
const isOn = id => S.sel[id] && S.sel[id].on;
function condOk(cond) {
  const [id, ...vals] = cond;
  if (vals[0] === 'on') return isOn(id);
  if (vals[0] === 'off') return !isOn(id);
  return isOn(id) && vals.includes(S.sel[id].opt);
}
function renderCaps() {
  document.getElementById('caps').innerHTML = DATA.caps.map(c => {
    const ok = c.need.every(g => g.some(isOn));
    return `<li class="${ok ? 'yes' : 'no'}"><span class="mark" aria-hidden="true">${ok ? '✓' : '—'}</span>${esc(L(c))}</li>`;
  }).join('');
  const warn = DATA.checks.filter(ch => ch.when.every(condOk));
  const box = document.getElementById('checks');
  box.hidden = !warn.length;
  box.innerHTML = `<b>${t('checks')}</b><ul>${warn.map(w => `<li>${esc(L(w))}</li>`).join('')}</ul>`;
}
function basis(o) {
  if (o.basis === 'est') return `<span class="est">${t('est')}</span>`;
  const s = DATA.sources[o.basis];
  return `<a class="src" href="${s[1]}" target="_blank" rel="noopener" title="${esc(s[0])}">${t('src')}</a>`;
}

function renderStatic() {
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.getElementById('lang').textContent = t('lang');
  document.getElementById('summary').innerHTML = DATA.summary.map(s => `<li>${L(s)}</li>`).join('');
  document.getElementById('presets').innerHTML = DATA.presets.map(p =>
    `<button type="button" data-preset="${p}" aria-pressed="${S.preset === p}">${esc(L(DATA.presetLabel[p]))}</button>`).join('');
  document.getElementById('curs').innerHTML = ['USD','LYD'].map(c =>
    `<button type="button" data-cur="${c}" aria-pressed="${S.cur === c}">${c === 'USD' ? '$ USD' : (S.lang === 'ar' ? 'دينار ليبي' : 'LYD')}</button>`).join('');
  document.getElementById('installs').innerHTML = ['contractor','own'].map(m =>
    `<button type="button" data-install="${m}" aria-pressed="${S.install === m}">${t('install_' + m)}</button>`).join('');
  document.getElementById('presetNote').textContent = S.preset ? L(DATA.presetNote[S.preset]) : '';
  document.getElementById('approve').hidden = S.preset !== 'minimum';
  renderZones(); renderTables();
}

function renderBuilder() {
  const out = [];
  for (const [g, gl] of Object.entries(DATA.groups)) {
    out.push(`<div class="group"><h3>${esc(L(gl))}</h3>`);
    for (const it of DATA.items.filter(i => i.group === g)) {
      const s = S.sel[it.id], o = optOf(it), cost = o.qty * o.unit;
      const opts = it.options.map(x => {
        const tags = x.presets.map(p => L(DATA.presetLabel[p])).join(' · ');
        return `<option value="${x.key}" ${x.key === o.key ? 'selected' : ''}>${esc(L(x.product))}${tags ? ' — ' + esc(tags) : ''}</option>`;
      }).join('');
      out.push(`<div class="row ${s.on ? '' : 'off'}">
        <input type="checkbox" id="chk-${it.id}" data-item="${it.id}" ${s.on ? 'checked' : ''}>
        <div class="what"><label for="chk-${it.id}">${esc(L(it.what))}</label>
          <div class="chips"><span class="chip ${it.minimum ? 'ess' : ''}">${t(it.minimum ? 'essential' : 'optional')}</span><span class="chip">${esc(L(DATA.phases[it.phase]))}</span></div>
          ${L(it.skip) ? `<div class="skip">${t('if_skipped')}: ${esc(L(it.skip))}</div>` : ''}
          ${it.local ? `<div class="skip">${t('local_note')}</div>` : ''}</div>
        <div class="opt"><select id="sel-${it.id}" data-opt="${it.id}" aria-label="${esc(L(it.what))}">${opts}</select>
          ${L(o.note) ? `<div class="optnote">${esc(L(o.note))}</div>` : ''}</div>
        <div class="cost">${money(cost)}<small>${nf.format(o.qty)} × ${S.cur === 'USD' ? '$' + (o.unit < 10 ? o.unit : nf.format(o.unit)) : money(o.unit)} · ${basis(o)}</small></div></div>`);
    }
    out.push('</div>');
  }
  document.getElementById('builder').innerHTML = out.join('');
}

function renderTotals() {
  const x = totals();
  document.getElementById('total').textContent = money(x.total);
  document.getElementById('totalOther').textContent = '≈ ' + other(x.total);
  document.getElementById('breakdown').innerHTML =
    `${t('hardware')} <b>${money(x.hw)}</b> · ${t('freight')} <b>${money(x.f)}</b> · ${t('install')} <b>${money(x.i)}</b> · ${t('contingency')} <b>${money(x.c)}</b>`;
  document.getElementById('phases').innerHTML = [1,2,3].map(p => `<span class="kv">${esc(L(DATA.phases[p]))}: <b>${money(x.ph[p])}</b></span>`).join('')
;
  document.getElementById('count').innerHTML = `· ${t('items_on')}: <b>${x.n}</b>`;
  renderCaps();
}

function renderZones() {
  document.getElementById('zoneRows').innerHTML = DATA.zones.map(z => `<tr class="${S.focus && S.focus.zone === z.id ? 'sel' : ''}">
    <td class="num">${z.n}</td><td>${esc(L(z.name))}</td><td>${esc(L(DATA.crops[z.crop]))}</td><td class="num">${z.area}</td>
    <td class="num">${z.valve}</td><td class="mono">${z.valve_ll.join(', ')}</td><td class="num">${z.cable}</td>
    <td>${esc(L(z.conn))}</td><td>${z.depths.length} × ${z.depths.join(', ')} cm</td><td class="mono">${z.sensor_ll.join(', ')}</td></tr>`).join('');
}

function table(head, rows) {
  return `<table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function renderTables() {
  document.getElementById('plcTable').innerHTML = table(L(DATA.plcHead), DATA.plc.map(r => L(r)));
  document.getElementById('wiringTable').innerHTML = table(L(DATA.wiringHead), DATA.wiring.map(r => L(r)));
  document.getElementById('futureTable').innerHTML = table(L(DATA.futureHead), DATA.future.map(r => L(r)));
  document.getElementById('overrideTable').innerHTML = table(L(DATA.overrideHead), DATA.override.map(r => L(r)));
  document.getElementById('buying').innerHTML = DATA.buying.map(b => `<li>${L(b)}</li>`).join('');
  document.getElementById('survey').innerHTML = DATA.survey.map(b => `<li>${esc(L(b))}</li>`).join('');
  document.getElementById('sources').innerHTML = Object.values(DATA.sources).map(s => `<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('');
}

function itemsAt(loc) {
  return DATA.items.filter(it => it.loc === loc && S.sel[it.id].on)
    .map(it => `<li>${esc(L(optOf(it).product))} <span class="kv">· ${money(costOf(it))}</span></li>`).join('');
}
function hereList(loc) {
  const items = itemsAt(loc);
  return `<div><b>${t('here')}</b>${items ? `<ul>${items}</ul>` : `<p class="kv">${t('nothing_here')}</p>`}</div>`;
}
function renderPanel() {
  const el = document.getElementById('panel');
  document.querySelectorAll('.map .sel').forEach(n => n.classList.remove('sel'));
  const f = S.focus;
  if (!f) {
    el.innerHTML = `<p class="lede">${t('map_hint')}</p>` + Object.values(DATA.locations).map(l =>
      `<div><b>${esc(L(l))}</b><div class="kv">${esc(l['how_' + S.lang])}</div></div>`).join('');
    return;
  }
  if (f.zone) {
    const z = DATA.zones.find(z => z.id === f.zone);
    document.querySelectorAll(`.map [data-zone="${z.id}"]`).forEach(n => n.classList.add('sel'));
    const key = f.kind === 'sensor' ? 'zones' : 'field';
    el.innerHTML = `<h3>${z.n}. ${esc(L(z.name))}</h3><dl>
      <dt>${t('crop')}</dt><dd>${esc(L(DATA.crops[z.crop]))} · ${z.area} ha</dd>
      <dt>${t('valve')}</dt><dd>${z.valve} · <span class="kv">${z.valve_ll.join(', ')}</span></dd>
      <dt>${t('cable')}</dt><dd>${z.cable} m · ${esc(L(z.conn))}</dd>
      <dt>${t('sensors')}</dt><dd>${z.depths.length} × ${z.depths.join(', ')} cm · <span class="kv">${z.sensor_ll.join(', ')}</span></dd></dl>
      <div class="kv">${esc(DATA.locations[key]['how_' + S.lang])}</div>${hereList(key)}`;
    renderZones();
    return;
  }
  const l = DATA.locations[f.loc];
  document.querySelectorAll(`.map [data-loc="${f.loc}"]`).forEach(n => n.classList.add('sel'));
  el.innerHTML = `<h3>${esc(L(l))}</h3><div class="kv">${esc(l['how_' + S.lang])}</div>${hereList(f.loc)}`;
}

function all() { renderStatic(); renderBuilder(); renderTotals(); renderPanel(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-preset],[data-cur],[data-install],#lang,.hot');
  if (!b) return;
  if (b.dataset.preset) { applyPreset(b.dataset.preset); all(); }
  else if (b.dataset.cur) { S.cur = b.dataset.cur; save(); all(); }
  else if (b.dataset.install) { S.install = b.dataset.install; all(); }
  else if (b.id === 'lang') { S.lang = S.lang === 'ar' ? 'en' : 'ar'; save(); all(); }
  else { S.focus = b.dataset.zone ? {zone:b.dataset.zone, kind:b.dataset.kind || 'valve'} : {loc:b.dataset.loc}; renderPanel(); }
});
document.addEventListener('keydown', e => {
  const b = e.target.closest && e.target.closest('.hot');
  if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); b.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.item) S.sel[el.dataset.item].on = el.checked;
  else if (el.dataset.opt) { S.sel[el.dataset.opt].opt = el.value; S.sel[el.dataset.opt].on = true; }
  else return;
  S.preset = null;
  document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  document.getElementById('presetNote').textContent = '';
  document.getElementById('approve').hidden = true;
  renderBuilder(); renderTotals(); renderPanel();
  const back = document.getElementById(el.id); if (back) back.focus();
});

applyPreset('recommended');
all();
</script>
